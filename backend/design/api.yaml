components:
  schemas:
    Account:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 6
          title: Email
        password:
          type: string
          maxLength: 256
          minLength: 8
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: Account
    Answer:
      properties:
        question_id:
          type: string
          format: uuid
          title: Question Id
        member_order:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Member Order
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
        file_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: File Id
      additionalProperties: false
      type: object
      required:
      - question_id
      title: Answer
    AnswersUpdate:
      properties:
        answers:
          items:
            $ref: '#/components/schemas/Answer'
          type: array
          maxItems: 250
          minItems: 1
          title: Answers
      additionalProperties: false
      type: object
      required:
      - answers
      title: AnswersUpdate
    ApplyForAdmin:
      properties:
        full_name:
          type: string
          maxLength: 200
          minLength: 2
          title: Full Name
      additionalProperties: false
      type: object
      required:
      - full_name
      title: ApplyForAdmin
    ApprovalDecision:
      type: string
      enum:
      - APPROVED
      - REJECTED
      - SUSPENDED
      title: ApprovalDecision
    Body_cms_upload_api_v1_admin_cms_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_cms_upload_api_v1_admin_cms_upload_post
    Body_upload_registration_file_api_v1_registrations__registration_id__upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_registration_file_api_v1_registrations__registration_id__upload_post
    ContentRevision:
      properties:
        text_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Text Value
        link_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Link Url
        alt_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Alt Text
        asset_file_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Asset File Id
        poster_file_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Poster File Id
        content_json:
          additionalProperties: true
          type: object
          title: Content Json
        display_order:
          type: integer
          title: Display Order
          default: 0
        is_visible:
          type: boolean
          title: Is Visible
          default: true
      additionalProperties: false
      type: object
      title: ContentRevision
    EditionHighlight:
      properties:
