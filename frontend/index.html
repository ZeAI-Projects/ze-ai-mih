<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8c52ff" />
    <link rel="preload" href="/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" as="image" href="/media/flight/hero-960.webp" imagesrcset="/media/flight/hero-550.webp 550w, /media/flight/hero-960.webp 960w" imagesizes="(max-width: 767px) 85vw, 480px" fetchpriority="high" />
    <title>Made in India — Bring your ideas to life</title>
    <meta
      name="description"
      content="Bring a problem you care about and build something people can use. Explore Made in India, a hackathon by product company ZeAI Soft, and its upcoming edition."
    />
    <meta property="og:title" content="Made in India — Bring your ideas to life" />
    <meta
      property="og:description"
      content="Bring a problem you care about and build something people can use. Explore Made in India, a hackathon by product company ZeAI Soft, and its upcoming edition."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      const root = document.documentElement;
      const preference = matchMedia('(prefers-color-scheme: dark)');
      const savedTheme = () => {
        try {
          const value = localStorage.getItem('miih.theme');
          return value === 'light' || value === 'dark' ? value : null;
        } catch {
          return null;
        }
      };
      root.dataset.theme = savedTheme() || (preference.matches ? 'dark' : 'light');
      preference.addEventListener('change', event => {
        if (savedTheme()) return;
        root.dataset.theme = event.matches ? 'dark' : 'light';
        window.dispatchEvent(new Event('miih:theme-change'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Please enable JavaScript to view Made in India. For event enquiries, email
      info@zeaisoft.com.</noscript
    >
  </body>
</html>
